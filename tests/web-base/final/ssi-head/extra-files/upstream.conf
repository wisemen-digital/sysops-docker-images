log_format ssi_head_test '$http_x_forwarded_host|$request_id|$status';

map $http_x_forwarded_host $ssi_test_limit_rate {
  default 0;
  ~^(refresh|concurrent)- 256;
}

server {
  listen 127.0.0.1:18081;
  access_log /tmp/ssi-head-upstream.log ssi_head_test;

  location = /head {
    default_type text/html;
    gzip off;
    limit_rate $ssi_test_limit_rate;

    if ($http_x_forwarded_host ~ ^disconnect-) {
      return 444;
    }
    if ($http_x_forwarded_host ~ ^error-) {
      return 503 'upstream-error-body';
    }
    if ($http_x_forwarded_host ~ ^redirect-) {
      return 302 'upstream-error-body';
    }

    return 200 '<title>$http_x_forwarded_host</title><meta name="revision" content="$request_id" /><meta name="request" content="$http_cookie|$http_authorization|$args" /><!---->';
  }
}
